services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: stockai
      POSTGRES_USER: stockai
      POSTGRES_PASSWORD: stockai
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockai -d stockai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - stockai_postgres_data:/var/lib/postgresql

volumes:
  stockai_postgres_data:
