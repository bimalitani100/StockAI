name: StockAI CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build and test frontend
        run: npm test

  backend:
    name: Backend and database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      STOCKAI_DATABASE_URL: postgresql+psycopg://stockai:stockai@localhost:5433/stockai
      STOCKAI_JWT_SECRET_KEY: ci-only-secret-not-for-production
      STOCKAI_FRONTEND_ORIGIN: http://localhost:3000

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: stockai
          POSTGRES_USER: stockai
          POSTGRES_PASSWORD: stockai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U stockai -d stockai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Check for missing migrations
        working-directory: backend
        run: alembic check

      - name: Run backend tests
        working-directory: backend
        run: pytest -q
